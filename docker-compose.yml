# Pin image versions via .env (see docs/dependency-upgrades.md). Never use floating :latest.

name: societe

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgis/postgis:16-3.5}
    # Official PostGIS images are amd64-only; Docker Desktop emulates on Apple Silicon.
    platform: linux/amd64
    container_name: societe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-societe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-societe}
      POSTGRES_DB: ${POSTGRES_DB:-societe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - societe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-societe} -d ${POSTGRES_DB:-societe}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8.1.9}
    container_name: societe-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: societe-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-societe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-societe-minio-dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - societe_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: create the private quarantine/processed buckets with the same
  # adapter the API uses, then exit.
  minio-init:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        PYTHON_IMAGE: ${API_PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
    container_name: societe-minio-init
    env_file:
      - .env
    environment:
      APP_ENV: development
      FF_LOCATION_SIMULATOR: ${FF_LOCATION_SIMULATOR:-false}
      FF_PRIVATE_MESSAGING: ${FF_PRIVATE_MESSAGING:-false}
      AUTH_PROVIDER: local
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    working_dir: /app
    entrypoint: ["python", "scripts/init_object_storage.py"]
    volumes:
      - ./services/api/app:/app/services/api/app
      - ./scripts:/app/scripts
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.30.5}
    container_name: societe-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        PYTHON_IMAGE: ${API_PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
    container_name: societe-api
    env_file:
      - .env
    environment:
      APP_ENV: development
      AUTH_PROVIDER: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-societe}:${POSTGRES_PASSWORD:-societe}@postgres:5432/${POSTGRES_DB:-societe}
      VALKEY_URL: redis://valkey:6379/0
      MINIO_ENDPOINT: http://minio:9000
      # Must be reachable from the device running the app: localhost for iOS
      # simulator, 10.0.2.2 for the Android emulator, LAN IP for a real phone.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MAILPIT_SMTP_HOST: mailpit
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount sources only — do not overwrite /app/.venv from the image.
      - ./services/api/app:/app/services/api/app
      - ./services/api/migrations:/app/services/api/migrations
      - ./services/api/alembic.ini:/app/services/api/alembic.ini
      - ./packages/contracts:/contracts
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  location-aggregator:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        PYTHON_IMAGE: ${API_PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
    container_name: societe-location-aggregator
    env_file:
      - .env
    environment:
      APP_ENV: development
      AUTH_PROVIDER: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-societe}:${POSTGRES_PASSWORD:-societe}@postgres:5432/${POSTGRES_DB:-societe}
      VALKEY_URL: redis://valkey:6379/0
      PYTHONPATH: /app/services/workers
    entrypoint: ["python", "-m", "location_aggregator"]
    volumes:
      - ./services/api/app:/app/services/api/app
      - ./services/workers:/app/services/workers
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy

  media-processor:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        PYTHON_IMAGE: ${API_PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
    container_name: societe-media-processor
    env_file:
      - .env
    environment:
      APP_ENV: development
      AUTH_PROVIDER: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-societe}:${POSTGRES_PASSWORD:-societe}@postgres:5432/${POSTGRES_DB:-societe}
      VALKEY_URL: redis://valkey:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MEDIA_WORKER_HEARTBEAT_PATH: /tmp/societe-media-processor.heartbeat
      PYTHONPATH: /app/services/workers
    entrypoint: ["python", "-m", "media_processor"]
    volumes:
      - ./services/api/app:/app/services/api/app
      - ./services/workers:/app/services/workers
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      # Liveness alone would call a wedged worker healthy; the heartbeat is
      # refreshed by each loop pass.
      test: ["CMD", "python", "-m", "media_processor.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  event-dispatcher:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        PYTHON_IMAGE: ${API_PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
    container_name: societe-event-dispatcher
    env_file:
      - .env
    environment:
      APP_ENV: development
      AUTH_PROVIDER: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-societe}:${POSTGRES_PASSWORD:-societe}@postgres:5432/${POSTGRES_DB:-societe}
      VALKEY_URL: redis://valkey:6379/0
      FF_PRIVATE_MESSAGING: ${FF_PRIVATE_MESSAGING:-false}
      REALTIME_PROVIDER: ${REALTIME_PROVIDER:-local}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-local}
      # Local WS hub lives on the API (WS /v1/realtime/ws); no separate hub service.
      REALTIME_ACK_WAIT_SECONDS: ${REALTIME_ACK_WAIT_SECONDS:-2}
      REALTIME_ACK_TTL_SECONDS: ${REALTIME_ACK_TTL_SECONDS:-300}
      EVENT_DISPATCHER_HEARTBEAT_PATH: /tmp/societe-event-dispatcher.heartbeat
      PYTHONPATH: /app/services/workers
    entrypoint: ["python", "-m", "event_dispatcher"]
    volumes:
      - ./services/api/app:/app/services/api/app
      - ./services/workers:/app/services/workers
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "event_dispatcher.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  societe_postgres_data:
  societe_minio_data:
