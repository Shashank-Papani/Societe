<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 920" width="450" height="920" style="background: #090908; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  
  <!-- DEFINITIONS: GLOWS, GRADIENTS & SHADOWS -->
  <defs>
    <!-- Intense Neon Ambient Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Glass Shadow -->
    <filter id="glassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Color Gradients -->
    <linearGradient id="neonBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84F220"/>
      <stop offset="100%" stop-color="#5BC710"/>
    </linearGradient>

    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23221F"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>

    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(52, 50, 46, 0.88)"/>
      <stop offset="100%" stop-color="rgba(30, 29, 27, 0.95)"/>
    </linearGradient>

    <linearGradient id="capacityBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7CA41"/>
      <stop offset="50%" stop-color="#EB8B2D"/>
      <stop offset="100%" stop-color="#6EE51E"/>
    </linearGradient>

    <!-- Clip Paths -->
    <clipPath id="screenClip">
      <rect x="25" y="25" width="400" height="870" rx="44"/>
    </clipPath>
    
    <clipPath id="avatarClip">
      <circle cx="0" cy="0" r="18"/>
    </clipPath>
  </defs>

  <!-- OUTER PHONE BODY FRAME -->
  <rect x="20" y="20" width="410" height="880" rx="48" fill="#121211" stroke="#33322E" stroke-width="3" filter="url(#glassShadow)"/>
  
  <!-- SCREEN CANVAS (CLIPPED) -->
  <g clip-path="url(#screenClip)">
    <!-- Screen Background -->
    <rect x="25" y="25" width="400" height="870" fill="url(#darkBgGrad)"/>

    <!-- Dynamic Island / Notch -->
    <rect x="165" y="35" width="120" height="30" rx="15" fill="#0A0A09"/>
    <circle cx="268" cy="50" r="5" fill="#1A1918"/>

    <!-- TOP APP HEADER -->
    <g transform="translate(45, 85)">
      <!-- Location Dropdown -->
      <text x="0" y="0" font-size="11" font-weight="700" fill="#6EE51E" letter-spacing="1">LIVE IN</text>
      <text x="0" y="22" font-size="22" font-weight="900" fill="#FCFCFA" letter-spacing="-0.5">West Hollywood ▾</text>
      
      <!-- User Profile Avatar with Glowing Online Badge -->
      <g transform="translate(320, 8)">
        <circle cx="0" cy="0" r="20" fill="#383632" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
        <text x="-6" y="6" font-size="16">🪩</text>
        <circle cx="14" cy="14" r="5" fill="#6EE51E" stroke="#1C1B1A" stroke-width="2" filter="url(#neonGlow)"/>
      </g>
    </g>

    <!-- LIVE STORIES / REELS HORIZONTAL BAR -->
    <g transform="translate(45, 140)">
      <!-- Story 1: Bar Lis (Live Glow Ring) -->
      <g transform="translate(0, 0)">
        <circle cx="26" cy="26" r="27" fill="none" stroke="#6EE51E" stroke-width="2.5" filter="url(#neonGlow)"/>
        <rect x="2" y="2" width="48" height="48" rx="24" fill="#383632"/>
        <text x="14" y="32" font-size="20">🍸</text>
        <text x="26" y="66" font-size="10" font-weight="700" fill="#FCFCFA" text-anchor="middle">Bar Lis</text>
      </g>

      <!-- Story 2: Zouk -->
      <g transform="translate(72, 0)">
        <circle cx="26" cy="26" r="26" fill="none" stroke="#EB8B2D" stroke-width="2"/>
        <rect x="2" y="2" width="48" height="48" rx="24" fill="#383632"/>
        <text x="14" y="32" font-size="20">💃</text>
        <text x="26" y="66" font-size="10" font-weight="600" fill="#706E6B" text-anchor="middle">Zouk</text>
      </g>

      <!-- Story 3: Victorian -->
      <g transform="translate(144, 0)">
        <circle cx="26" cy="26" r="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
        <rect x="2" y="2" width="48" height="48" rx="24" fill="#383632"/>
        <text x="14" y="32" font-size="20">🎷</text>
        <text x="26" y="66" font-size="10" font-weight="600" fill="#706E6B" text-anchor="middle">Victorian</text>
      </g>

      <!-- Story 4: Bungalow -->
      <g transform="translate(216, 0)">
        <circle cx="26" cy="26" r="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
        <rect x="2" y="2" width="48" height="48" rx="24" fill="#383632"/>
        <text x="14" y="32" font-size="20">🌴</text>
        <text x="26" y="66" font-size="10" font-weight="600" fill="#706E6B" text-anchor="middle">Bungalow</text>
      </g>
    </g>

    <!-- LIVE MAP CARD INTERACTIVE VIEW -->
    <g transform="translate(45, 230)">
      <!-- Map Background Container -->
      <rect width="360" height="210" rx="24" fill="#181716" stroke="rgba(255,255,255,0.1)" stroke-width="1" filter="url(#glassShadow)"/>
      
      <!-- Dark Stylized Vector Map Roads -->
      <path d="M -10 90 Q 120 110, 200 60 T 380 140" fill="none" stroke="#2B2926" stroke-width="14"/>
      <path d="M 120 -10 Q 140 100, 280 220" fill="none" stroke="#2B2926" stroke-width="10"/>
      <path d="M -10 160 L 370 40" fill="none" stroke="#242220" stroke-width="6"/>

      <!-- Heatmap Zone (Sunset Orange Glow) -->
      <circle cx="220" cy="90" r="55" fill="#EB8B2D" opacity="0.12"/>
      <circle cx="220" cy="90" r="35" fill="#6EE51E" opacity="0.2" filter="url(#neonGlow)"/>

      <!-- Radar Pulse Ring around Active Selected Venue Pin -->
      <circle cx="220" cy="90" r="24" fill="none" stroke="#6EE51E" stroke-width="1.5" opacity="0.6"/>
      <circle cx="220" cy="90" r="14" fill="#6EE51E" filter="url(#neonGlow)"/>
      <circle cx="220" cy="90" r="5" fill="#285814"/>

      <!-- Secondary Map Pin -->
      <circle cx="100" cy="130" r="7" fill="#F7CA41" stroke="#1C1B1A" stroke-width="2"/>

      <!-- Floating Live Radar Pill Badge -->
      <rect x="16" y="16" width="138" height="32" rx="16" fill="rgba(28, 27, 26, 0.85)" stroke="#6EE51E" stroke-width="1"/>
      <circle cx="30" cy="32" r="4" fill="#6EE51E" filter="url(#neonGlow)"/>
      <text x="42" y="36" font-size="11" font-weight="800" fill="#6EE51E" letter-spacing="0.5">3 CLUBS PACKED</text>
    </g>

    <!-- SELECTED VENUE DETAILS CARD (GLASSMORPHISM) -->
    <g transform="translate(45, 460)" filter="url(#glassShadow)">
      <rect width="360" height="185" rx="24" fill="url(#glassCardGrad)" stroke="#6EE51E" stroke-width="1.5"/>

      <!-- Venue Title & Metadata -->
      <text x="24" y="38" font-size="20" font-weight="900" fill="#FCFCFA">BAR LIS ROOFTOP</text>
      <text x="24" y="58" font-size="12" font-weight="600" fill="#8C8A88">Deep House • 180m away • $$$</text>

      <!-- Live Capacity Badge -->
      <rect x="230" y="22" width="106" height="28" rx="10" fill="rgba(110, 229, 30, 0.12)" stroke="rgba(110, 229, 30, 0.3)" stroke-width="1"/>
      <text x="242" y="40" font-size="11" font-weight="800" fill="#6EE51E">🔥 88% PACKED</text>

      <!-- Live Capacity Bar -->
      <rect x="24" y="82" width="312" height="8" rx="4" fill="#1C1B1A"/>
      <rect x="24" y="82" width="274" height="8" rx="4" fill="url(#capacityBarGrad)"/>

      <!-- Active Crowd Avatars Stack -->
      <g transform="translate(24, 110)">
        <circle cx="14" cy="14" r="14" fill="#E2E8F0" stroke="#2C2B28" stroke-width="2"/>
        <text x="6" y="19" font-size="12">👱🏻‍♀️</text>
        
        <circle cx="34" cy="14" r="14" fill="#CBD5E1" stroke="#2C2B28" stroke-width="2"/>
        <text x="26" y="19" font-size="12">👨🏽</text>
        
        <circle cx="54" cy="14" r="14" fill="#94A3B8" stroke="#2C2B28" stroke-width="2"/>
        <text x="46" y="19" font-size="12">👩🏻</text>
        
        <text x="80" y="18" font-size="12" font-weight="700" fill="#FCFCFA">+142 checked in now</text>
      </g>

      <!-- Call To Action Button: Send Calling Card -->
      <rect x="24" y="136" width="312" height="38" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="110" y="160" font-size="12" font-weight="800" fill="#FCFCFA" letter-spacing="0.5">IN VENUE • TAP TO CONNECT</text>
    </g>

    <!-- FLOATING INCOMING "CALLING CARD" BOTTOM DRAWER -->
    <g transform="translate(35, 630)" filter="url(#glassShadow)">
      <!-- Card Container with Neon Glow Border -->
      <rect width="380" height="175" rx="28" fill="#242320" stroke="#6EE51E" stroke-width="2"/>
      
      <!-- Top Drag Handle -->
      <rect x="170" y="10" width="40" height="4" rx="2" fill="#42403B"/>

      <!-- Calling Card Header -->
      <g transform="translate(24, 32)">
        <!-- Sender Avatar -->
        <circle cx="22" cy="22" r="22" fill="#3D3B36" stroke="#6EE51E" stroke-width="2"/>
        <text x="8" y="30" font-size="22">🏼‍♂️</text>
        
        <!-- Sender Details -->
        <text x="56" y="18" font-size="16" font-weight="900" fill="#FCFCFA">BEN, 24</text>
        <text x="56" y="34" font-size="11" font-weight="600" fill="#8C8A88">Finance • USC Alum • At Bar Lis</text>
        
        <!-- Note Pill -->
        <rect x="0" y="52" width="332" height="32" rx="10" fill="#1A1918"/>
        <text x="12" y="72" font-size="12" font-style="italic" fill="#6EE51E">"Love the dance moves! Let’s get a drink? 🍸"</text>

        <!-- Action Buttons -->
        <!-- Decline -->
        <rect x="0" y="94" width="100" height="36" rx="10" fill="#33312D"/>
        <text x="28" y="116" font-size="12" font-weight="700" fill="#FCFCFA">Decline</text>

        <!-- Accept & Share Info (Primary Glowing Accent) -->
        <rect x="110" y="94" width="222" height="36" rx="10" fill="url(#neonBgGrad)" filter="url(#neonGlow)"/>
        <text x="145" y="116" font-size="12" font-weight="900" fill="#285814" letter-spacing="0.2">⚡ ACCEPT &amp; SHARE INFO</text>
      </g>
    </g>

    <!-- BOTTOM FLOATING DOCK NAVIGATION -->
    <g transform="translate(65, 822)">
      <rect width="320" height="56" rx="28" fill="#1C1B1A" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#glassShadow)"/>
      
      <!-- Active Tab: Discover -->
      <g transform="translate(60, 28)">
        <circle cx="0" cy="0" r="16" fill="rgba(110, 229, 30, 0.15)"/>
        <circle cx="0" cy="0" r="5" fill="#6EE51E" filter="url(#neonGlow)"/>
      </g>

      <!-- Tab: Vibe Map -->
      <g transform="translate(160, 28)">
        <circle cx="0" cy="0" r="5" fill="#706E6B"/>
      </g>

      <!-- Tab: Profile -->
      <g transform="translate(260, 28)">
        <circle cx="0" cy="0" r="5" fill="#706E6B"/>
      </g>
    </g>

    <!-- Home Indicator Bar -->
    <rect x="160" y="886" width="130" height="4" rx="2" fill="#FCFCFA" opacity="0.6"/>
  </g>
</svg>
