components:
  schemas:
    AccountDeletionRequest:
      properties:
        confirmation:
          const: DELETE
          title: Confirmation
          type: string
      required:
      - confirmation
      title: AccountDeletionRequest
      type: object
    DeviceCreate:
      properties:
        app_version:
          anyOf:
          - type: string
          - type: 'null'
          title: App Version
        installation_id:
          format: uuid
          title: Installation Id
          type: string
        os_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Os Version
        platform:
          enum:
          - ios
          - android
          title: Platform
          type: string
      required:
      - platform
      - installation_id
      title: DeviceCreate
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LocalDevTokenRequest:
      properties:
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      title: LocalDevTokenRequest
      type: object
    PrivacyPatch:
      properties:
        allow_calling_cards:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Calling Cards
        analytics_opt_out:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Analytics Opt Out
        discoverable_in_venue:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Discoverable In Venue
        ghost_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ghost Mode
        show_social_links_after_accept:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Show Social Links After Accept
      title: PrivacyPatch
      type: object
    ProfilePatch:
      properties:
        age_band:
          anyOf:
          - enum:
            - 18-20
            - 21-24
            - 25-29
            - 30-34
            - 35+
            type: string
          - type: 'null'
          title: Age Band
        bio:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Bio
        display_name:
          anyOf:
          - maxLength: 80
            minLength: 1
            type: string
          - type: 'null'
          title: Display Name
        handle:
          anyOf:
          - maxLength: 32
            minLength: 3
            type: string
          - type: 'null'
          title: Handle
      title: ProfilePatch
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: "Soci\xE9t\xE9 API"
  version: 0.1.0
openapi: 3.1.0
paths:
  /health/live:
    get:
      description: 'Liveness: process is up. Does not check dependencies.'
      operationId: health_live_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Live Health Live Get
                type: object
          description: Successful Response
      summary: Health Live
      tags:
      - health
  /health/ready:
    get:
      description: 'Readiness: required dependencies are reachable.'
      operationId: health_ready_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Ready Health Ready Get
                type: object
          description: Successful Response
      summary: Health Ready
      tags:
      - health
  /v1/auth/local/token:
    post:
      operationId: issue_local_dev_token_v1_auth_local_token_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/LocalDevTokenRequest'
              - type: 'null'
              title: ' Body'
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Issue Local Dev Token V1 Auth Local Token Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Issue Local Dev Token
      tags:
      - identity
  /v1/map/venues:
    get:
      operationId: map_venues_v1_map_venues_get
      parameters:
      - in: query
        name: latitude
        required: true
        schema:
          title: Latitude
          type: number
      - in: query
        name: longitude
        required: true
        schema:
          title: Longitude
          type: number
      - in: query
        name: radius_m
        required: false
        schema:
          default: 3000
          maximum: 25000
          minimum: 50
          title: Radius M
          type: integer
      - in: query
        name: music_tags
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Music Tags
      - in: query
        name: experience_tags
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Experience Tags
      - in: query
        name: price_bands
        required: false
        schema:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Price Bands
      - in: query
        name: categories
        required: false
        schema:
          anyOf:
          - items:
              enum:
              - nightclub
              - bar
              - lounge
              - rooftop
              - live_music
              - warehouse
              type: string
            type: array
          - type: 'null'
          title: Categories
      - in: query
        name: minimum_age
        required: false
        schema:
          anyOf:
          - maximum: 25
            minimum: 18
            type: integer
          - type: 'null'
          title: Minimum Age
      - in: query
        name: age_bands
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Age Bands
      - in: query
        name: crowd_buckets
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Crowd Buckets
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 50
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Map Venues V1 Map Venues Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Map Venues
      tags:
      - venues
  /v1/me:
    get:
      operationId: get_me_v1_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Me V1 Me Get
                type: object
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get Me
      tags:
      - identity
    patch:
      operationId: patch_me_v1_me_patch
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Patch Me V1 Me Patch
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Patch Me
      tags:
      - identity
  /v1/me/account-deletion:
    post:
      description: Soft-deletion request. Idempotency replay runs before account-status
        denial.
      operationId: request_account_deletion_v1_me_account_deletion_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Request Account Deletion V1 Me Account Deletion Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Request Account Deletion
      tags:
      - identity
  /v1/me/devices:
    post:
      operationId: register_device_v1_me_devices_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Register Device V1 Me Devices Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Register Device
      tags:
      - identity
  /v1/me/devices/{device_id}:
    delete:
      operationId: delete_device_v1_me_devices__device_id__delete
      parameters:
      - in: path
        name: device_id
        required: true
        schema:
          format: uuid
          title: Device Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Delete Device V1 Me Devices  Device Id  Delete
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Device
      tags:
      - identity
  /v1/me/privacy:
    patch:
      operationId: patch_privacy_v1_me_privacy_patch
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyPatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Patch Privacy V1 Me Privacy Patch
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Patch Privacy
      tags:
      - identity
  /v1/venues/{venue_id}:
    get:
      operationId: get_venue_v1_venues__venue_id__get
      parameters:
      - in: path
        name: venue_id
        required: true
        schema:
          format: uuid
          title: Venue Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Venue V1 Venues  Venue Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Venue
      tags:
      - venues
