components:
  schemas:
    AccountDeletionRequest:
      properties:
        confirmation:
          const: DELETE
          title: Confirmation
          type: string
      required:
      - confirmation
      title: AccountDeletionRequest
      type: object
    CompleteUploadRequest:
      additionalProperties: false
      properties:
        checksum_sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Checksum Sha256
        device_id:
          format: uuid
          title: Device Id
          type: string
      required:
      - device_id
      title: CompleteUploadRequest
      type: object
    CreateReportRequest:
      additionalProperties: false
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        reason:
          enum:
          - spam
          - harassment
          - sexual_content
          - violence
          - hate
          - illegal
          - other
          title: Reason
          type: string
      required:
      - reason
      title: CreateReportRequest
      type: object
    CreateUploadRequest:
      additionalProperties: false
      properties:
        byte_size:
          exclusiveMinimum: 0.0
          title: Byte Size
          type: integer
        caption:
          anyOf:
          - type: string
          - type: 'null'
          title: Caption
        checksum_sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Checksum Sha256
        device_id:
          format: uuid
          title: Device Id
          type: string
        media_type:
          enum:
          - image
          - video
          title: Media Type
          type: string
        mime_type:
          maxLength: 100
          minLength: 3
          title: Mime Type
          type: string
        original_filename:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Original Filename
        venue_id:
          format: uuid
          title: Venue Id
          type: string
        vibe_tags:
          items:
            type: string
          title: Vibe Tags
          type: array
      required:
      - venue_id
      - device_id
      - media_type
      - mime_type
      - byte_size
      title: CreateUploadRequest
      type: object
    DeviceCreate:
      properties:
        app_version:
          anyOf:
          - type: string
          - type: 'null'
          title: App Version
        installation_id:
          format: uuid
          title: Installation Id
          type: string
        os_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Os Version
        platform:
          enum:
          - ios
          - android
          title: Platform
          type: string
      required:
      - platform
      - installation_id
      title: DeviceCreate
      type: object
    EvidenceLocation:
      additionalProperties: false
      properties:
        altitude_m:
          anyOf:
          - maximum: 12000.0
            minimum: -500.0
            type: number
          - type: 'null'
          title: Altitude M
        horizontal_accuracy_m:
          maximum: 10000.0
          minimum: 0.0
          title: Horizontal Accuracy M
          type: number
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        provider:
          enum:
          - fused
          - gps
          - network
          - simulated
          title: Provider
          type: string
        speed_mps:
          anyOf:
          - maximum: 350.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Speed Mps
      required:
      - latitude
      - longitude
      - horizontal_accuracy_m
      - provider
      title: EvidenceLocation
      type: object
    EvidenceRequest:
      additionalProperties: false
      properties:
        candidate_venue_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Candidate Venue Id
        client_sequence:
          minimum: 0.0
          title: Client Sequence
          type: integer
        device_id:
          format: uuid
          title: Device Id
          type: string
        evidence_id:
          format: uuid
          title: Evidence Id
          type: string
        location:
          $ref: '#/components/schemas/EvidenceLocation'
        observed_at:
          format: date-time
          title: Observed At
          type: string
        platform_signals:
          $ref: '#/components/schemas/PlatformSignals'
      required:
      - evidence_id
      - observed_at
      - location
      - platform_signals
      - client_sequence
      - device_id
      title: EvidenceRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LeaveRequest:
      additionalProperties: false
      properties:
        confirmation:
          anyOf:
          - const: LEAVE
            type: string
          - type: 'null'
          title: Confirmation
      title: LeaveRequest
      type: object
    LocalDevTokenRequest:
      properties:
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      title: LocalDevTokenRequest
      type: object
    PlatformSignals:
      additionalProperties: false
      properties:
        app_state:
          enum:
          - foreground
          - background
          title: App State
          type: string
        is_mock:
          title: Is Mock
          type: boolean
        is_simulated:
          title: Is Simulated
          type: boolean
      required:
      - is_mock
      - is_simulated
      - app_state
      title: PlatformSignals
      type: object
    PrivacyPatch:
      properties:
        allow_calling_cards:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Calling Cards
        analytics_opt_out:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Analytics Opt Out
        discoverable_in_venue:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Discoverable In Venue
        ghost_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ghost Mode
        show_social_links_after_accept:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Show Social Links After Accept
      title: PrivacyPatch
      type: object
    ProfilePatch:
      properties:
        age_band:
          anyOf:
          - enum:
            - 18-20
            - 21-24
            - 25-29
            - 30-34
            - 35+
            type: string
          - type: 'null'
          title: Age Band
        bio:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Bio
        display_name:
          anyOf:
          - maxLength: 80
            minLength: 1
            type: string
          - type: 'null'
          title: Display Name
        handle:
          anyOf:
          - maxLength: 32
            minLength: 3
            type: string
          - type: 'null'
          title: Handle
      title: ProfilePatch
      type: object
    SimulatorRequest:
      additionalProperties: false
      description: Development-only spatial input; replayed through the production
        engine.
      properties:
        altitude_m:
          anyOf:
          - maximum: 12000.0
            minimum: -500.0
            type: number
          - type: 'null'
          title: Altitude M
        candidate_venue_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Candidate Venue Id
        client_sequence:
          default: 0
          minimum: 0.0
          title: Client Sequence
          type: integer
        device_id:
          format: uuid
          title: Device Id
          type: string
        horizontal_accuracy_m:
          default: 8.0
          maximum: 10000.0
          minimum: 0.0
          title: Horizontal Accuracy M
          type: number
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        provider:
          default: simulated
          enum:
          - fused
          - gps
          - network
          - simulated
          title: Provider
          type: string
        speed_mps:
          anyOf:
          - maximum: 350.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Speed Mps
      required:
      - latitude
      - longitude
      - device_id
      title: SimulatorRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: "Soci\xE9t\xE9 API"
  version: 0.1.0
openapi: 3.1.0
paths:
  /health/live:
    get:
      description: 'Liveness: process is up. Does not check dependencies.'
      operationId: health_live_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Live Health Live Get
                type: object
          description: Successful Response
      summary: Health Live
      tags:
      - health
  /health/ready:
    get:
      description: 'Readiness: required dependencies are reachable.'
      operationId: health_ready_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Ready Health Ready Get
                type: object
          description: Successful Response
      summary: Health Ready
      tags:
      - health
  /v1/auth/local/token:
    post:
      operationId: issue_local_dev_token_v1_auth_local_token_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/LocalDevTokenRequest'
              - type: 'null'
              title: ' Body'
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Issue Local Dev Token V1 Auth Local Token Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Issue Local Dev Token
      tags:
      - identity
  /v1/dev/location/simulate:
    post:
      description: Development-only. Runs the production engine with is_simulated=true.
      operationId: simulate_location_v1_dev_location_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatorRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Simulate Location V1 Dev Location Simulate Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Simulate Location
      tags:
      - presence
  /v1/map/venues:
    get:
      operationId: map_venues_v1_map_venues_get
      parameters:
      - in: query
        name: latitude
        required: true
        schema:
          title: Latitude
          type: number
      - in: query
        name: longitude
        required: true
        schema:
          title: Longitude
          type: number
      - in: query
        name: radius_m
        required: false
        schema:
          default: 3000
          maximum: 25000
          minimum: 50
          title: Radius M
          type: integer
      - in: query
        name: music_tags
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Music Tags
      - in: query
        name: experience_tags
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Experience Tags
      - in: query
        name: price_bands
        required: false
        schema:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Price Bands
      - in: query
        name: categories
        required: false
        schema:
          anyOf:
          - items:
              enum:
              - nightclub
              - bar
              - lounge
              - rooftop
              - live_music
              - warehouse
              type: string
            type: array
          - type: 'null'
          title: Categories
      - in: query
        name: minimum_age
        required: false
        schema:
          anyOf:
          - maximum: 25
            minimum: 18
            type: integer
          - type: 'null'
          title: Minimum Age
      - in: query
        name: age_bands
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Age Bands
      - in: query
        name: crowd_buckets
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Crowd Buckets
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 50
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Map Venues V1 Map Venues Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Map Venues
      tags:
      - venues
  /v1/me:
    get:
      operationId: get_me_v1_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Me V1 Me Get
                type: object
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get Me
      tags:
      - identity
    patch:
      operationId: patch_me_v1_me_patch
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Patch Me V1 Me Patch
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Patch Me
      tags:
      - identity
  /v1/me/account-deletion:
    post:
      description: Soft-deletion request. Idempotency replay runs before account-status
        denial.
      operationId: request_account_deletion_v1_me_account_deletion_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Request Account Deletion V1 Me Account Deletion Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Request Account Deletion
      tags:
      - identity
  /v1/me/devices:
    post:
      operationId: register_device_v1_me_devices_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Register Device V1 Me Devices Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Register Device
      tags:
      - identity
  /v1/me/devices/{device_id}:
    delete:
      operationId: delete_device_v1_me_devices__device_id__delete
      parameters:
      - in: path
        name: device_id
        required: true
        schema:
          format: uuid
          title: Device Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Delete Device V1 Me Devices  Device Id  Delete
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Device
      tags:
      - identity
  /v1/me/privacy:
    patch:
      operationId: patch_privacy_v1_me_privacy_patch
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyPatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Patch Privacy V1 Me Privacy Patch
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Patch Privacy
      tags:
      - identity
  /v1/me/vibes:
    get:
      description: 'Creator history: expired vibes stay as metadata; media URLs are
        retention-gated.'
      operationId: my_vibes_v1_me_vibes_get
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: limit
        required: false
        schema:
          default: 12
          maximum: 30
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response My Vibes V1 Me Vibes Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: My Vibes
      tags:
      - vibes
  /v1/media/uploads:
    post:
      operationId: create_upload_v1_media_uploads_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Upload V1 Media Uploads Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create Upload
      tags:
      - media
  /v1/media/uploads/{upload_id}:
    get:
      operationId: get_upload_v1_media_uploads__upload_id__get
      parameters:
      - in: path
        name: upload_id
        required: true
        schema:
          format: uuid
          title: Upload Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Upload V1 Media Uploads  Upload Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Upload
      tags:
      - media
  /v1/media/uploads/{upload_id}/complete:
    post:
      operationId: complete_upload_v1_media_uploads__upload_id__complete_post
      parameters:
      - in: path
        name: upload_id
        required: true
        schema:
          format: uuid
          title: Upload Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Complete Upload V1 Media Uploads  Upload Id  Complete
                  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Complete Upload
      tags:
      - media
  /v1/presence/evidence:
    post:
      operationId: submit_evidence_v1_presence_evidence_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Submit Evidence V1 Presence Evidence Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Submit Evidence
      tags:
      - presence
  /v1/presence/leave:
    post:
      operationId: leave_presence_v1_presence_leave_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/LeaveRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Leave Presence V1 Presence Leave Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Leave Presence
      tags:
      - presence
  /v1/presence/me:
    get:
      operationId: get_presence_me_v1_presence_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Presence Me V1 Presence Me Get
