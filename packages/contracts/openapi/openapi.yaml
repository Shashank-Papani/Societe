components:
  schemas:
    AccountDeletionRequest:
      properties:
        confirmation:
          const: DELETE
          title: Confirmation
          type: string
      required:
      - confirmation
      title: AccountDeletionRequest
      type: object
    BlockUserRequest:
      additionalProperties: false
      properties:
        reason_code:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Reason Code
      title: BlockUserRequest
      type: object
    CompleteUploadRequest:
      additionalProperties: false
      properties:
        checksum_sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Checksum Sha256
        device_id:
          format: uuid
          title: Device Id
          type: string
      required:
      - device_id
      title: CompleteUploadRequest
      type: object
    CreateCallingCardRequest:
      additionalProperties: false
      properties:
        reason_code:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Reason Code
        reason_text:
          anyOf:
          - maxLength: 280
            type: string
          - type: 'null'
          title: Reason Text
        recipient_user_id:
          format: uuid
          title: Recipient User Id
          type: string
      required:
      - recipient_user_id
      title: CreateCallingCardRequest
      type: object
    CreateConversationRequest:
      additionalProperties: false
      properties:
        connection_grant_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Connection Grant Id
        other_user_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Other User Id
      title: CreateConversationRequest
      type: object
    CreateReportRequest:
      additionalProperties: false
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        reason:
          enum:
          - spam
          - harassment
          - sexual_content
          - violence
          - hate
          - illegal
          - other
          title: Reason
          type: string
      required:
      - reason
      title: CreateReportRequest
      type: object
    CreateUploadRequest:
      additionalProperties: false
      properties:
        byte_size:
          exclusiveMinimum: 0.0
          title: Byte Size
          type: integer
        caption:
          anyOf:
          - type: string
          - type: 'null'
          title: Caption
        checksum_sha256:
          anyOf:
          - pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Checksum Sha256
        device_id:
          format: uuid
          title: Device Id
          type: string
        media_type:
          enum:
          - image
          - video
          title: Media Type
          type: string
        mime_type:
          maxLength: 100
          minLength: 3
          title: Mime Type
          type: string
        original_filename:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Original Filename
        venue_id:
          format: uuid
          title: Venue Id
          type: string
        vibe_tags:
          items:
            type: string
          title: Vibe Tags
          type: array
      required:
      - venue_id
      - device_id
      - media_type
      - mime_type
      - byte_size
      title: CreateUploadRequest
      type: object
    DeviceCreate:
      properties:
        app_version:
          anyOf:
          - type: string
          - type: 'null'
          title: App Version
        installation_id:
          format: uuid
          title: Installation Id
          type: string
        os_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Os Version
        platform:
          enum:
          - ios
          - android
          title: Platform
          type: string
      required:
      - platform
      - installation_id
      title: DeviceCreate
      type: object
    EvidenceLocation:
      additionalProperties: false
      properties:
        altitude_m:
          anyOf:
          - maximum: 12000.0
            minimum: -500.0
            type: number
          - type: 'null'
          title: Altitude M
        horizontal_accuracy_m:
          maximum: 10000.0
          minimum: 0.0
          title: Horizontal Accuracy M
          type: number
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        provider:
          enum:
          - fused
          - gps
          - network
          - simulated
          title: Provider
          type: string
        speed_mps:
          anyOf:
          - maximum: 350.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Speed Mps
      required:
      - latitude
      - longitude
      - horizontal_accuracy_m
      - provider
      title: EvidenceLocation
      type: object
    EvidenceRequest:
      additionalProperties: false
      properties:
        candidate_venue_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Candidate Venue Id
        client_sequence:
          minimum: 0.0
          title: Client Sequence
          type: integer
        device_id:
          format: uuid
          title: Device Id
          type: string
        evidence_id:
          format: uuid
          title: Evidence Id
          type: string
        location:
          $ref: '#/components/schemas/EvidenceLocation'
        observed_at:
          format: date-time
          title: Observed At
          type: string
        platform_signals:
          $ref: '#/components/schemas/PlatformSignals'
      required:
      - evidence_id
      - observed_at
      - location
      - platform_signals
      - client_sequence
      - device_id
      title: EvidenceRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LeaveRequest:
      additionalProperties: false
      properties:
        confirmation:
          anyOf:
          - const: LEAVE
            type: string
          - type: 'null'
          title: Confirmation
      title: LeaveRequest
      type: object
    LocalDevTokenRequest:
      additionalProperties: false
      properties:
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        persona:
          anyOf:
          - type: string
          - type: 'null'
          title: Persona
      title: LocalDevTokenRequest
      type: object
    MarkReadRequest:
      additionalProperties: false
      properties:
        last_read_message_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Last Read Message Id
      title: MarkReadRequest
      type: object
    PlatformSignals:
      additionalProperties: false
      properties:
        app_state:
          enum:
          - foreground
          - background
          title: App State
          type: string
        is_mock:
          title: Is Mock
          type: boolean
        is_simulated:
          title: Is Simulated
          type: boolean
      required:
      - is_mock
      - is_simulated
      - app_state
      title: PlatformSignals
      type: object
    PrivacyPatch:
      properties:
        allow_calling_cards:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Calling Cards
        analytics_opt_out:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Analytics Opt Out
        discoverable_in_venue:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Discoverable In Venue
        ghost_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ghost Mode
        show_social_links_after_accept:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Show Social Links After Accept
      title: PrivacyPatch
      type: object
    ProfilePatch:
      properties:
        age_band:
          anyOf:
          - enum:
            - 18-20
            - 21-24
            - 25-29
            - 30-34
            - 35+
            type: string
          - type: 'null'
          title: Age Band
        bio:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Bio
        display_name:
          anyOf:
          - maxLength: 80
            minLength: 1
            type: string
          - type: 'null'
          title: Display Name
        handle:
          anyOf:
          - maxLength: 32
            minLength: 3
            type: string
          - type: 'null'
          title: Handle
      title: ProfilePatch
      type: object
    RespondCallingCardRequest:
      additionalProperties: false
      properties:
        action:
          anyOf:
          - enum:
            - share_info
            - make_move
            - accept_only
            type: string
          - type: 'null'
          title: Action
        decision:
          enum:
          - accept
          - decline
          title: Decision
          type: string
        share_scopes:
          items:
            enum:
            - instagram
            - spotify
            - phone
            - snapchat
            - display_name
            type: string
          title: Share Scopes
          type: array
      required:
      - decision
      title: RespondCallingCardRequest
      type: object
    SendMessageRequest:
      additionalProperties: false
      properties:
        body:
          maxLength: 4000
          minLength: 1
          title: Body
          type: string
        client_message_id:
          maxLength: 128
          minLength: 8
          title: Client Message Id
          type: string
      required:
      - body
      - client_message_id
      title: SendMessageRequest
      type: object
    ShareCallingCardRequest:
      additionalProperties: false
      properties:
        share_scopes:
          items:
            enum:
            - instagram
            - spotify
            - phone
            - snapchat
            - display_name
            type: string
          maxItems: 10
          minItems: 0
          title: Share Scopes
          type: array
      required:
      - share_scopes
      title: ShareCallingCardRequest
      type: object
    SimulatorRequest:
      additionalProperties: false
      description: Development-only spatial input; replayed through the production
        engine.
      properties:
        altitude_m:
          anyOf:
          - maximum: 12000.0
            minimum: -500.0
            type: number
          - type: 'null'
          title: Altitude M
        candidate_venue_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Candidate Venue Id
        client_sequence:
          default: 0
          minimum: 0.0
          title: Client Sequence
          type: integer
        device_id:
          format: uuid
          title: Device Id
          type: string
        horizontal_accuracy_m:
          default: 8.0
          maximum: 10000.0
          minimum: 0.0
          title: Horizontal Accuracy M
          type: number
        latitude:
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          type: number
        longitude:
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          type: number
        provider:
          default: simulated
          enum:
          - fused
          - gps
          - network
          - simulated
          title: Provider
          type: string
        speed_mps:
          anyOf:
          - maximum: 350.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Speed Mps
      required:
      - latitude
      - longitude
      - device_id
      title: SimulatorRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: "Soci\xE9t\xE9 API"
  version: 0.1.0
openapi: 3.1.0
paths:
  /health/live:
    get:
      description: 'Liveness: process is up. Does not check dependencies.'
      operationId: health_live_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Live Health Live Get
                type: object
          description: Successful Response
      summary: Health Live
      tags:
      - health
  /health/ready:
    get:
      description: 'Readiness: required dependencies are reachable.'
      operationId: health_ready_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Health Ready Health Ready Get
                type: object
          description: Successful Response
      summary: Health Ready
      tags:
      - health
  /v1/auth/local/token:
    post:
      operationId: issue_local_dev_token_v1_auth_local_token_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/LocalDevTokenRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Issue Local Dev Token V1 Auth Local Token Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Issue Local Dev Token
      tags:
      - identity
  /v1/calling-cards:
    post:
      operationId: create_calling_card_v1_calling_cards_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCallingCardRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Calling Card V1 Calling Cards Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create Calling Card
      tags:
      - social
  /v1/calling-cards/inbox:
    get:
      operationId: calling_card_inbox_v1_calling_cards_inbox_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Calling Card Inbox V1 Calling Cards Inbox Get
                type: object
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Calling Card Inbox
      tags:
      - social
  /v1/calling-cards/sent:
    get:
      operationId: calling_card_sent_v1_calling_cards_sent_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Calling Card Sent V1 Calling Cards Sent Get
                type: object
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Calling Card Sent
      tags:
      - social
  /v1/calling-cards/{calling_card_id}:
    get:
      operationId: calling_card_detail_v1_calling_cards__calling_card_id__get
      parameters:
      - in: path
        name: calling_card_id
        required: true
        schema:
          format: uuid
          title: Calling Card Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Calling Card Detail V1 Calling Cards  Calling Card
                  Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Calling Card Detail
      tags:
      - social
  /v1/calling-cards/{calling_card_id}/cancel:
    post:
      operationId: cancel_calling_card_v1_calling_cards__calling_card_id__cancel_post
      parameters:
      - in: path
        name: calling_card_id
        required: true
        schema:
          format: uuid
          title: Calling Card Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Cancel Calling Card V1 Calling Cards  Calling Card
                  Id  Cancel Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Cancel Calling Card
      tags:
      - social
  /v1/calling-cards/{calling_card_id}/respond:
    post:
      operationId: respond_calling_card_v1_calling_cards__calling_card_id__respond_post
      parameters:
      - in: path
        name: calling_card_id
        required: true
        schema:
          format: uuid
          title: Calling Card Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondCallingCardRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Respond Calling Card V1 Calling Cards  Calling Card
                  Id  Respond Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Respond Calling Card
      tags:
      - social
  /v1/calling-cards/{calling_card_id}/share:
    post:
      operationId: share_calling_card_v1_calling_cards__calling_card_id__share_post
      parameters:
      - in: path
        name: calling_card_id
        required: true
        schema:
          format: uuid
          title: Calling Card Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCallingCardRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Share Calling Card V1 Calling Cards  Calling Card
                  Id  Share Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Share Calling Card
      tags:
      - social
  /v1/calling-cards/{calling_card_id}/status:
    get:
      operationId: calling_card_status_v1_calling_cards__calling_card_id__status_get
      parameters:
      - in: path
        name: calling_card_id
        required: true
        schema:
          format: uuid
          title: Calling Card Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Calling Card Status V1 Calling Cards  Calling Card
                  Id  Status Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Calling Card Status
      tags:
      - social
  /v1/conversations:
    get:
      operationId: list_conversations_v1_conversations_get
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: limit
        required: false
        schema:
          default: 30
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: include_archived
        required: false
        schema:
          default: false
          title: Include Archived
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Conversations V1 Conversations Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Conversations
      tags:
      - messaging
    post:
      operationId: create_conversation_v1_conversations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Conversation V1 Conversations Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create Conversation
      tags:
      - messaging
  /v1/conversations/{conversation_id}:
    get:
      operationId: get_conversation_v1_conversations__conversation_id__get
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          format: uuid
          title: Conversation Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Conversation V1 Conversations  Conversation Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Conversation
      tags:
      - messaging
  /v1/conversations/{conversation_id}/archive:
    post:
      operationId: archive_conversation_v1_conversations__conversation_id__archive_post
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          format: uuid
          title: Conversation Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Archive Conversation V1 Conversations  Conversation
                  Id  Archive Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Archive Conversation
      tags:
      - messaging
  /v1/conversations/{conversation_id}/messages:
    get:
      operationId: list_messages_v1_conversations__conversation_id__messages_get
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          format: uuid
          title: Conversation Id
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Messages V1 Conversations  Conversation Id  Messages
                  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Messages
      tags:
      - messaging
    post:
      operationId: send_message_v1_conversations__conversation_id__messages_post
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          format: uuid
          title: Conversation Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Send Message V1 Conversations  Conversation Id  Messages
